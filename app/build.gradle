plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.xpramt.bilisurfacebridge'
    compileSdk 37
    ndkVersion '28.0.12674087'

    defaultConfig {
        applicationId 'dev.xpramt.bilisurfacebridge'
        minSdk 24
        targetSdk 35
        versionCode 229
        versionName '1.5.0'

        // Tells module generations apart in the log: every build gets its own marker.
        buildConfigField "String", "BUILD_MARKER", "\"${new Date().format('MMdd-HHmmss')}\""

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++20'
            }
        }
    }

    // Release builds are signed with the debug key so they install over earlier builds.
    // A dedicated key can be used with -PreleaseSigningProperties=<path> (a properties file
    // with storeFile/storePassword/keyAlias/keyPassword, kept outside the repository).
    def signingPropertiesPath = project.findProperty('releaseSigningProperties')
    def signingPropertiesFile = signingPropertiesPath ? file(signingPropertiesPath) : null
    signingConfigs {
        release {
            if (signingPropertiesFile != null && signingPropertiesFile.isFile()) {
                def signing = new Properties()
                signingPropertiesFile.withInputStream { signing.load(it) }
                storeFile file(signing['storeFile'])
                storePassword signing['storePassword']
                keyAlias signing['keyAlias']
                keyPassword signing['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingPropertiesFile != null && signingPropertiesFile.isFile()
                    ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    testImplementation 'junit:junit:4.13.2'
}
